<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">maki-genui</title>
  <desc id="d">Generative UI for the maki coding agent: a form, a table and a progress bar rendered as terminal text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12141c"/>
      <stop offset="1" stop-color="#0b0c11"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cf4"/>
      <stop offset="1" stop-color="#3fc1a7"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .ui   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink  { fill: #e6e8ef; }
    .mute { fill: #7c8294; }
    .acc  { fill: #a594ff; }
    .ok   { fill: #3fc1a7; }
    .box  { fill: #5a6075; }
  </style>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- left: title block -->
  <g class="ui">
    <text x="72" y="214" font-size="30" class="mono mute" xml:space="preserve">$ maki.pack.add</text>
    <text x="72" y="286" font-size="72" font-weight="700" class="ink" letter-spacing="-1.5">maki-genui</text>
    <rect x="74" y="308" width="200" height="4" rx="2" fill="url(#glow)"/>
    <text x="72" y="356" font-size="26" class="ink">Generative UI for the maki coding agent</text>
    <text x="72" y="392" font-size="20" class="mute">The model describes a screen as JSON; the plugin renders it</text>
    <text x="72" y="420" font-size="20" class="mute">as real terminal UI and returns what the user did as data.</text>
  </g>
  <g class="mono" font-size="17">
    <rect x="72" y="452" width="118" height="32" rx="6" fill="#1b1e2a" stroke="#2b2f40"/>
    <text x="131" y="474" text-anchor="middle" class="acc">ui_render</text>
    <rect x="200" y="452" width="118" height="32" rx="6" fill="#1b1e2a" stroke="#2b2f40"/>
    <text x="259" y="474" text-anchor="middle" class="acc">ui_update</text>
    <rect x="328" y="452" width="112" height="32" rx="6" fill="#1b1e2a" stroke="#2b2f40"/>
    <text x="384" y="474" text-anchor="middle" class="acc">ui_close</text>
  </g>

  <!-- right: terminal window -->
  <rect x="640" y="56" width="500" height="488" rx="14" fill="#0a0b10" stroke="#262a3a"/>
  <rect x="640" y="56" width="500" height="36" rx="14" fill="#161925"/>
  <rect x="640" y="78" width="500" height="14" fill="#161925"/>
  <circle cx="664" cy="74" r="6" fill="#ff5f57"/>
  <circle cx="684" cy="74" r="6" fill="#febc2e"/>
  <circle cx="704" cy="74" r="6" fill="#28c840"/>
  <text x="890" y="79" text-anchor="middle" font-size="13" class="mono mute">ui_render · interactive</text>

  <!-- card frame -->
  <rect x="668" y="118" width="444" height="404" rx="6" fill="none" stroke="#3a3f55" stroke-width="2"/>
  <rect x="684" y="104" width="196" height="28" fill="#0a0b10"/>
  <text x="692" y="126" font-size="19" font-weight="700" class="mono ink">Deploy settings</text>
  <!-- focused row highlight -->
  <rect x="676" y="187" width="428" height="27" rx="4" fill="#1e2033"/>
  <g class="mono" font-size="19">
    <text x="692" y="152" class="box" xml:space="preserve"><tspan class="ink">Environment</tspan></text>
    <text x="692" y="178" class="box" xml:space="preserve">  <tspan class="mute">○ staging</tspan></text>
    <text x="692" y="204" class="box" xml:space="preserve"><tspan class="acc">▶ ● production</tspan></text>
    <text x="692" y="230" class="box" xml:space="preserve">  <tspan class="mute">○ canary</tspan></text>
    <text x="692" y="282" class="box" xml:space="preserve"><tspan class="ink">Replicas</tspan>    <tspan class="mute">[</tspan> <tspan class="ink">3</tspan>      <tspan class="mute">]</tspan></text>
    <text x="692" y="334" class="box" xml:space="preserve"><tspan class="mute">Service    Status    p95</tspan></text>
    <text x="692" y="360" class="box" xml:space="preserve"><tspan class="ink">api</tspan>        <tspan class="ok">● ok</tspan>      <tspan class="ink">42 ms</tspan></text>
    <text x="692" y="386" class="box" xml:space="preserve"><tspan class="ink">worker</tspan>     <tspan class="ok">● ok</tspan>      <tspan class="ink">88 ms</tspan></text>
    <text x="692" y="438" class="box" xml:space="preserve"><tspan class="ink">Rollout</tspan>  <tspan class="ok">████████████</tspan><tspan class="box">░░░░░░</tspan>  <tspan class="ink">64%</tspan></text>
    <text x="692" y="490" class="box" xml:space="preserve">     <tspan class="acc" font-weight="700">[ Submit ]</tspan>   <tspan class="mute">[ Cancel ]</tspan></text>
  </g>
</svg>
